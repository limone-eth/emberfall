<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#0d0b0a;color:#f3e9dc;font:12px system-ui,sans-serif}
.wrap{display:flex;flex-direction:column;height:100%;padding:12px;box-sizing:border-box;gap:8px}
.q{font-weight:600;font-size:14px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-height:0}
figure{margin:0;display:flex;flex-direction:column;gap:4px;min-height:0}canvas{width:100%;flex:1;min-height:0;object-fit:contain;image-rendering:pixelated;border-radius:4px}
figcaption{color:#a8998a}
</style></head><body><div class="wrap"><div class="q">Which art style for Emberfall?</div><div class="row">
<figure><canvas width="480" height="270" data-style="px8"></canvas><figcaption>Pixel 8 px</figcaption></figure>
<figure><canvas width="480" height="270" data-style="px16"></canvas><figcaption>Pixel 16 px</figcaption></figure>
<figure><canvas width="480" height="270" data-style="vector"></canvas><figcaption>Clean vector</figcaption></figure>
</div></div><script type="module">import { render } from "./scene.js"; document.querySelectorAll("canvas").forEach(c => render(c, c.dataset.style));</script></body></html>
